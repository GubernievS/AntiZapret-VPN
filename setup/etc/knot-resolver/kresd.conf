-- Knot DNS Resolver configuration in -*- lua -*-
-- Refer to manual: https://www.knot-resolver.cz/documentation/latest5

local min_ttl = 1800 -- Minimum TTL in seconds
local max_ttl = 86400 -- Maximum TTL in seconds
local antizapret_dns = 1 -- AntiZapret VPN DNS
local vpn_dns = 2 -- Full VPN DNS
local proxy_dns = vpn_dns -- Proxy DNS
local systemd_instance = os.getenv('SYSTEMD_INSTANCE')
local alternative_zones = policy.todnames({
	-- https://wiki.opennic.org/opennic/dot
	-- OpenNIC
	'bbs', 'chan', 'cyb', 'dyn', 'epic', 'geek', 'gopher', 'indy', 'libre', 'neo', 'null', 'o', 'oss', 'oz', 'parody', 'pirate', 'opennic.glue',
	-- Emercoin
	'bazar', 'coin', 'emc', 'lib',
	-- FurNIC
	'fur',
	-- New Nations
	'ku', 'te', 'ti', 'uu', 'ko', 'rm'
})
local answer = policy.ANSWER({
	-- Zero A (0.0.0.0)
	[kres.type.A] = { rdata = kres.str2ip('0.0.0.0'), ttl = max_ttl },
	-- Zero AAAA (::)
	[kres.type.AAAA] = { rdata = kres.str2ip('::'), ttl = max_ttl },
	-- Empty HTTPS
	[kres.type.HTTPS] = { rdata = kres.parse_rdata({'HTTPS 1 .'}), ttl = max_ttl },
	-- Empty SVCB
	[kres.type.SVCB] = { rdata = kres.parse_rdata({'SVCB 1 .'}), ttl = max_ttl }
}, true)

-- Upstream DNS resolvers
dofile('/etc/knot-resolver/dns.lua')

-- Upstream DNS action (FORWARD or STUB)
local function upstream(dns)
	if dns == 1 then
		return russia_dns
	elseif dns == 2 then
		return world_dns
	elseif dns == 3 then
		return yandex_dns
	elseif dns == 4 then
		return google_dns
	elseif dns == 5 then
		return adguard_dns
	elseif dns == 6 then
		return comss_dns
	elseif dns == 7 then
		return geohide_dns
	else
		panic('Invalid dns value')
	end
end

-- Match query type to action
local function match_query_type(action, target_qtype)
	return function (state, query)
		if query.stype == target_qtype then
			return action
		else
			return nil
		end
	end
end

-- Deny queries containing invalid characters in the domain name
local function valid_chars_only(state, query)
	local name = kres.dname2str(query.sname)
	if name and not string.match(name, '^[%w%-%._]+%.?$') then
		return policy.DENY
	else
		return nil
	end
end

if string.match(systemd_instance, '^1') then

	-- Network interface configuration
	net.listen('127.1.1.1', 53, {kind = 'dns', freebind = true})

	-- Switch to unprivileged user
	user('knot-resolver', 'knot-resolver')

	-- Clear cache upon restart
	os.execute('rm -rf /var/cache/knot-resolver/*')

	-- Open cache and set size
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver')

	-- Load useful modules
	modules = {
		'view' -- Views for certain clients
		,renumber = dofile('/etc/knot-resolver/renumber.lua') -- IP address renumbering
		,'fallback' -- Fallback on a bad answer from policy.FORWARD
	}

	-- Bind hostname to gateway IPv4
	view:addr('10.29.0.0/21', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.0.1'), ttl = min_ttl}}, true), {todname(hostname())}))
	view:addr('10.29.8.0/21', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.8.1'), ttl = min_ttl}}, true), {todname(hostname())}))
	view:addr('10.29.16.0/21', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.16.1'), ttl = min_ttl}}, true), {todname(hostname())}))

	-- Private, local, broadcast, test and special zones policy
	for _, item in ipairs(policy.special_names) do
		policy.add(item.cb)
	end

	-- Return NXDOMAIN response for invalid characters in domain name
	policy.add(valid_chars_only)

	-- Return NXDOMAIN response for '*_*.arpa' queries
	policy.add(policy.pattern(policy.DENY, '.*_.*\4arpa\0'))

	-- Return NXDOMAIN response for Active Directory queries
	policy.add(policy.pattern(policy.DENY, '^\3_gc'))
	policy.add(policy.pattern(policy.DENY, '^\5_ldap'))
	policy.add(policy.pattern(policy.DENY, '^\6_vlmcs'))
	policy.add(policy.pattern(policy.DENY, '^\8_kpasswd'))
	policy.add(policy.pattern(policy.DENY, '^\9_kerberos'))
	policy.add(policy.pattern(policy.DENY, '\6_msdcs'))
	policy.add(policy.pattern(policy.DENY, '\6_sites'))

	-- Return NXDOMAIN response for Web Proxy Auto-Discovery queries
	policy.add(policy.pattern(policy.DENY, '^\4wpad'))

	-- Return NXDOMAIN response for Apple Content Caching queries
	policy.add(policy.pattern(policy.DENY, '^[\10\11]_aaplcache'))

	-- Return NXDOMAIN response for DNS Service Discovery queries
	policy.add(policy.pattern(policy.DENY, '\7_dns%-sd'))

	-- Return zero IPv6 response for AAAA queries
	policy.add(match_query_type(answer, kres.type.AAAA))

	-- Return empty response for HTTPS and SVCB queries
	policy.add(match_query_type(answer, kres.type.HTTPS))
	policy.add(match_query_type(answer, kres.type.SVCB))

	-- Disable EDNS and query case randomization in upstream DNS queries
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	-- Custom DNS policies
	dofile('/etc/knot-resolver/custom.lua')

	-- Response policy zones and optional blocking ads, trackers, malware and phishing websites
	policy.add(policy.rpz(answer, '/etc/knot-resolver/deny.rpz', true))

	-- Resolve WARP domains
	policy.add(policy.rpz(policy.STUB('127.5.5.5'), '/etc/knot-resolver/warp.rpz', true))

	-- Resolve blocked domains
	policy.add(policy.rpz(policy.STUB('127.4.4.4'), '/etc/knot-resolver/proxy.rpz', true))

	-- Resolve alternative domains: OpenNIC, Emercoin, FurNIC and New Nations
	policy.add(policy.suffix(alternative_dns, alternative_zones))

	-- Resolve non-blocked domains
	policy.add(policy.all(upstream(antizapret_dns)))

elseif string.match(systemd_instance, '^2') then

	-- Network interface configuration
	net.listen('127.2.2.2', 53, {kind = 'dns', freebind = true})

	-- Switch to unprivileged user
	user('knot-resolver', 'knot-resolver')

	-- Clear cache upon restart
	os.execute('rm -rf /var/cache/knot-resolver2/*')

	-- Open cache and set size
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver2')

	-- Load useful modules
	modules = {
		'view' -- Views for certain clients
		,renumber = dofile('/etc/knot-resolver/renumber2.lua') -- IP address renumbering
		,'fallback' -- Fallback on a bad answer from policy.FORWARD
	}

	-- Bind hostname to gateway IPv4
	view:addr('10.28.0.0/21', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.0.1'), ttl = min_ttl}}, true), {todname(hostname())}))
	view:addr('10.28.8.0/21', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.8.1'), ttl = min_ttl}}, true), {todname(hostname())}))
	view:addr('10.28.16.0/21', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.16.1'), ttl = min_ttl}}, true), {todname(hostname())}))

	-- Private, local, broadcast, test and special zones policy
	for _, item in ipairs(policy.special_names) do
		policy.add(item.cb)
	end

	-- Return NXDOMAIN response for invalid characters in domain name
	policy.add(valid_chars_only)

	-- Return NXDOMAIN response for '*_*.arpa' queries
	policy.add(policy.pattern(policy.DENY, '.*_.*\4arpa\0'))

	-- Return NXDOMAIN response for Active Directory queries
	policy.add(policy.pattern(policy.DENY, '^\3_gc'))
	policy.add(policy.pattern(policy.DENY, '^\5_ldap'))
	policy.add(policy.pattern(policy.DENY, '^\6_vlmcs'))
	policy.add(policy.pattern(policy.DENY, '^\8_kpasswd'))
	policy.add(policy.pattern(policy.DENY, '^\9_kerberos'))
	policy.add(policy.pattern(policy.DENY, '\6_msdcs'))
	policy.add(policy.pattern(policy.DENY, '\6_sites'))

	-- Return NXDOMAIN response for Web Proxy Auto-Discovery queries
	policy.add(policy.pattern(policy.DENY, '^\4wpad'))

	-- Return NXDOMAIN response for Apple Content Caching queries
	policy.add(policy.pattern(policy.DENY, '^[\10\11]_aaplcache'))

	-- Return NXDOMAIN response for DNS Service Discovery queries
	policy.add(policy.pattern(policy.DENY, '\7_dns%-sd'))

	-- Return zero IPv6 response for AAAA queries
	policy.add(match_query_type(answer, kres.type.AAAA))

	-- Return empty response for HTTPS and SVCB queries
	policy.add(match_query_type(answer, kres.type.HTTPS))
	policy.add(match_query_type(answer, kres.type.SVCB))

	-- Disable EDNS and query case randomization in upstream DNS queries
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	-- Custom DNS policies
	dofile('/etc/knot-resolver/custom2.lua')

	-- Response policy zones and optional blocking ads, trackers, malware and phishing websites
	policy.add(policy.rpz(answer, '/etc/knot-resolver/deny2.rpz', true))

	-- Resolve WARP domains
	policy.add(policy.rpz(policy.STUB('127.5.5.5'), '/etc/knot-resolver/warp2.rpz', true))

	-- Resolve alternative domains: OpenNIC, Emercoin, FurNIC and New Nations
	policy.add(policy.suffix(alternative_dns, alternative_zones))

	-- Resolve full VPN domains
	policy.add(policy.all(upstream(vpn_dns)))

elseif string.match(systemd_instance, '^3') then

	-- Network interface configuration
	net.listen('127.3.3.3', 53, {kind = 'dns', freebind = true})

	-- Switch to unprivileged user
	user('knot-resolver', 'knot-resolver')

	-- Clear cache upon restart
	os.execute('rm -rf /var/cache/knot-resolver3/*')

	-- Open cache and set size
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver3')

	-- Load useful modules
	modules = {
		renumber = dofile('/etc/knot-resolver/renumber3.lua') -- IP address renumbering
		,'fallback' -- Fallback on a bad answer from policy.FORWARD
	}

	-- Disable EDNS and query case randomization in upstream DNS queries
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	-- Custom DNS policies
	dofile('/etc/knot-resolver/custom3.lua')

	-- Response policy zones
	policy.add(policy.rpz(answer, '/etc/knot-resolver/deny3.rpz', true))

	-- Resolve Proxy DNS domains
	policy.add(policy.all(upstream(proxy_dns)))

else panic('Use kresd@1, kresd@2 or kresd@3 instance names')

end

-- Disable DNSSEC validation
trust_anchors.remove('.')

-- Disable using IPv6 for contacting upstream DNS
net.ipv6 = false

-- Set minimum and maximum TTL cache in seconds
cache.min_ttl(min_ttl)
cache.max_ttl(max_ttl)

-- Disable unused modules
modules.unload('refuse_nord')
modules.unload('validate')
modules.unload('ta_update')
modules.unload('ta_signal_query')
modules.unload('ta_sentinel')
modules.unload('detect_time_skew')
modules.unload('extended_error')
modules.unload('priming')
modules.unload('edns_keepalive')
modules.unload('detect_time_jump')

-- Uncomment and set outgoing IPv4 address for upstream DNS queries
--net.outgoing_v4('1.2.3.4')

-- Uncomment only for debugging or logging DNS requests
--log_level('debug')